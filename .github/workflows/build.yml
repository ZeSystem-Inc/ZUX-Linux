name: ZUX Linux ISO Build Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-zux-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Depodaki Dosyaları Çek
        uses: actions/checkout@v4

      - name: Derleme Araçlarını ve Bağımlılıkları Yükle
        run: |
          apt update
          apt install -y \
            build-essential flex bison bc libelf-dev libssl-dev \
            xorriso mtools dosfstools cpio gzip wget tar syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            python3 python3-gi gir1.2-gtk-3.0 ccache

      - name: Kernel Kaynak Kodu ve Derleme Önbelleği (Cache)
        uses: actions/cache@v4
        with:
          path: |
            src/linux
            ~/.cache/ccache
          key: ${{ runner.os }}-kernel-6.6.21-v1
          restore-keys: |
            ${{ runner.os }}-kernel-6.6.21-

      - name: Saf Linux Çekirdeği Kaynağını İndir
        run: |
          if [ ! -d "src/linux" ]; then
            mkdir -p src
            wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.21.tar.xz
            tar -xf linux-6.6.21.tar.xz -C src/
            mv src/linux-6.6.21 src/linux
          fi

      - name: Saf Kernel Konfigürasyonunu Yap
        run: |
          make -C src/linux defconfig
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_CGROUPS
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_AUTOFS4_FS
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_SIGNALFD
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_TIMERFD
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_EPOLL
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_DEVTMPFS
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_DEVTMPFS_MOUNT
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_NETDEVICES
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_ETHERNET
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_EXT4_FS
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_BLK_DEV_SD
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_ISO9660_FS
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_SQUASHFS
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_DRM
          src/linux/scripts/config --file src/linux/.config --enable CONFIG_DRM_FBDEV_EMULATION

      - name: Saf Linux Çekirdeğini Derle
        run: |
          make -C src/linux -j$(nproc) bzImage

      - name: ISO Dizin Yapısını ve GUI Bağımlılıklarını Initrd İçine Hazırla
        run: |
          mkdir -p iso_root/boot/grub
          cp src/linux/arch/x86/boot/bzImage iso_root/boot/vmlinuz

          mkdir -p initrd_dir/bin initrd_dir/sbin initrd_dir/etc initrd_dir/proc \
                   initrd_dir/sys initrd_dir/dev initrd_dir/tmp initrd_dir/usr/bin \
                   initrd_dir/usr/lib initrd_dir/lib initrd_dir/lib64

          cp -a /usr/bin/python3* initrd_dir/usr/bin/
          cp -a /usr/lib/python3* initrd_dir/usr/lib/
          cp -a /usr/lib/x86_64-linux-gnu/girepository-1.0 initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libgtk-3* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libgobject* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libglib* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libgio* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libgmodule* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libgdk* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libpango* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libcairo* initrd_dir/usr/lib/ 2>/dev/null || true
          cp -a /usr/lib/x86_64-linux-gnu/libatk* initrd_dir/usr/lib/ 2>/dev/null || true

          cp setup.sh initrd_dir/usr/bin/setup.sh
          cp zux-installer.py initrd_dir/usr/bin/zux-installer.py
          chmod +x initrd_dir/usr/bin/setup.sh
          chmod +x initrd_dir/usr/bin/zux-installer.py

          cat << 'EOF' > initrd_dir/init
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib:/lib64
          exec /usr/bin/setup.sh
          EOF
          chmod +x initrd_dir/init

          cd initrd_dir && find . | cpio -o -H newc | gzip -9 > ../iso_root/boot/initrd.img
          cd ..

          cat << 'EOF' > iso_root/boot/grub/grub.cfg
          set timeout=5
          set default=0

          insmod efi_gop
          insmod efi_uga
          insmod all_video
          insmod font

          menuentry "ZUX Linux Netinst (GUI Installer)" {
              linux /boot/vmlinuz root=/dev/ram0 rw quiet boot=live
              initrd /boot/initrd.img
          }
          EOF

      - name: Triple-Boot ve Hybrid Yüklenebilir ISO Kalıbını Oluştur
        run: |
          grub-mkrescue -o ZUX-Linux-netinst.iso iso_root -- -volid "ZUX_NETINST"
          isohybrid --uefi ZUX-Linux-netinst.iso || true

      - name: Oluşturulan ISO Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-Linux-Netinst-ISO
          path: ZUX-Linux-netinst.iso
          retention-days: 7
