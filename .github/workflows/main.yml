name: ZUX OS ISO Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies and Generic Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cpio xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools zip wget e2fsprogs linux-image-generic kmod

      - name: Create Workspace Directories
        run: |
          mkdir -p build_dir/iso_root/boot/grub
          mkdir -p build_dir/initrd_root/bin
          mkdir -p build_dir/initrd_root/sbin
          mkdir -p build_dir/initrd_root/usr/bin
          mkdir -p build_dir/initrd_root/usr/sbin
          mkdir -p build_dir/initrd_root/usr/share/udhcpc
          mkdir -p build_dir/initrd_root/proc
          mkdir -p build_dir/initrd_root/sys
          mkdir -p build_dir/initrd_root/dev
          mkdir -p build_dir/initrd_root/etc
          mkdir -p build_dir/initrd_root/lib/modules
          mkdir -p build_dir/initrd_root/mnt
          mkdir -p build_dir/initrd_root/tmp
          mkdir -p build_dir/initrd_root/installer
          mkdir -p build_dir/release_assets

      - name: Create BusyBox DHCP Script
        run: |
          cat << 'EOF' > build_dir/initrd_root/usr/share/udhcpc/default.script
          #!/bin/sh
          case "$1" in
              deconfig)
                  ip addr flush dev "$interface"
                  ;;
              renew|bound)
                  ip addr add "$ip/$mask" dev "$interface"
                  if [ -n "$router" ]; then
                      ip route add default via "$router" dev "$interface" 2>/dev/null || true
                  fi
                  if [ -n "$dns" ]; then
                      echo "" > /etc/resolv.conf
                      for i in $dns; do
                          echo "nameserver $i" >> /etc/resolv.conf
                      done
                  fi
                  ;;
          esac
          EOF
          chmod +x build_dir/initrd_root/usr/share/udhcpc/default.script

      - name: Download Static BusyBox Binary & Install Symlinks
        run: |
          WORKSPACE_DIR=$(pwd)
          wget -q https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox -O build_dir/initrd_root/bin/busybox
          chmod +x build_dir/initrd_root/bin/busybox

          cd build_dir/initrd_root
          ./bin/busybox --install -s .
          cd "${WORKSPACE_DIR}"

      - name: Copy Universal Generic Kernel Modules and Generate Map
        run: |
          KVER=$(ls -1 /lib/modules/ | grep generic | head -n 1)
          mkdir -p "build_dir/initrd_root/lib/modules/$KVER"
          sudo cp -r /lib/modules/$KVER/kernel "build_dir/initrd_root/lib/modules/$KVER/" 2>/dev/null || true
          sudo cp /lib/modules/$KVER/modules.* "build_dir/initrd_root/lib/modules/$KVER/" 2>/dev/null || true
          sudo chmod -R 755 "build_dir/initrd_root/lib/modules"
          sudo depmod -a -b build_dir/initrd_root "$KVER"

      - name: Compile Setup Installer
        run: |
          if [ -f setup.c ]; then
            gcc -O2 -s -static -Wno-unused-result setup.c -o build_dir/initrd_root/installer/setup.elf
          fi

      - name: Build Static C Init Launcher
        run: |
          cat << 'EOF' > init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/wait.h>

          int main(void) {
              setenv("PATH", "/bin:/sbin:/usr/bin:/usr/sbin", 1);

              mkdir("/proc", 0755);
              mkdir("/sys", 0755);
              mkdir("/dev", 0755);

              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);

              system("echo 1 > /proc/sys/kernel/printk");

              int fd = open("/dev/tty1", O_RDWR);
              if (fd < 0) fd = open("/dev/console", O_RDWR);
              if (fd >= 0) {
                  dup2(fd, 0);
                  dup2(fd, 1);
                  dup2(fd, 2);
                  if (fd > 2) close(fd);
              }

              printf("\033[H\033[J");
              printf("===============================================\n");
              printf("          ZUX OS Preinstallation Shell         \n");
              printf("===============================================\n\n");
              printf("[*] Donanim ve ag suruculeri yukleniyor...\n");
              fflush(stdout);

              system("depmod -a 2>/dev/null");
              system("modprobe e1000 2>/dev/null");
              system("modprobe e1000e 2>/dev/null");
              system("modprobe virtio_net 2>/dev/null");
              system("modprobe pcnet32 2>/dev/null");
              system("modprobe r8169 2>/dev/null");
              system("modprobe 8139too 2>/dev/null");

              system("find /lib/modules -name '*.ko*' -exec insmod {} \\; 2>/dev/null");

              sleep(2);

              system("ip link set lo up 2>/dev/null");

              printf("[*] Otomatik IP (DHCP) aliniyor...\n");
              fflush(stdout);

              system("for iface in $(ls /sys/class/net/ 2>/dev/null | grep -v lo); do "
                     "  ip link set $iface up 2>/dev/null; "
                     "  udhcpc -i $iface -n -t 5 -T 2 -q -s /usr/share/udhcpc/default.script >/dev/null 2>&1; "
                     "done");

              int connected = 0;
              for (int i = 0; i < 10; i++) {
                  if (system("ping -c 1 -W 1 8.8.8.8 >/dev/null 2>&1") == 0 ||
                      system("ping -c 1 -W 1 1.1.1.1 >/dev/null 2>&1") == 0) {
                      connected = 1;
                      printf("[+] Ag baglantisi kuruldu!\n\n");
                      fflush(stdout);
                      break;
                  }
                  sleep(1);
              }

              if (!connected) {
                  printf("[!] Dikkat: Ag baglantisi kurulamadi, kurulum devam ediyor...\n\n");
                  fflush(stdout);
              }

              if (access("/installer/setup.elf", X_OK) == 0) {
                  printf("[*] ZUX OS Otomatik Kurulum Baslatiliyor...\n\n");
                  fflush(stdout);
                  pid_t pid = fork();
                  if (pid == 0) {
                      execl("/installer/setup.elf", "/installer/setup.elf", NULL);
                      _exit(1);
                  } else if (pid > 0) {
                      int status;
                      waitpid(pid, &status, 0);
                  }
              }

              printf("\n[*] Shell ekranina aktariliyorsunuz...\n\n");
              fflush(stdout);

              while (1) {
                  if (access("/bin/busybox", X_OK) == 0) {
                      pid_t pid = fork();
                      if (pid == 0) {
                          execl("/bin/busybox", "busybox", "sh", NULL);
                          _exit(1);
                      } else if (pid > 0) {
                          int status;
                          waitpid(pid, &status, 0);
                      }
                  }
                  sleep(1);
              }
              return 0;
          }
          EOF
          gcc -O2 -s -static init.c -o build_dir/initrd_root/init

      - name: Copy Universal Generic Kernel
        run: |
          KERNEL_PATH=$(ls -1 /boot/vmlinuz-*-generic | head -n 1)
          sudo cp "$KERNEL_PATH" build_dir/iso_root/boot/vmlinuz
          sudo chmod 644 build_dir/iso_root/boot/vmlinuz

      - name: Prepare RootFS Zip
        run: |
          WORKSPACE_DIR=$(pwd)
          UPLOAD_DIR="${WORKSPACE_DIR}/build_dir/release_assets"

          if [ -d "rootfs" ] && [ "$(ls -A rootfs)" ]; then
            cd rootfs && zip -r "${UPLOAD_DIR}/ZUX.zip" . && cd "${WORKSPACE_DIR}"
          else
            DUMMY_DIR="${WORKSPACE_DIR}/tmp_rootfs"
            mkdir -p "${DUMMY_DIR}/etc"
            echo "ZUX OS Rootfs" > "${DUMMY_DIR}/etc/zux-release"
            cd "${DUMMY_DIR}" && zip -r "${UPLOAD_DIR}/ZUX.zip" . && cd "${WORKSPACE_DIR}"
            rm -rf "${DUMMY_DIR}"
          fi

      - name: Pack Initrd Payload
        run: |
          WORKSPACE_DIR=$(pwd)
          cd build_dir/initrd_root
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../iso_root/boot/initrd.img
          cd "${WORKSPACE_DIR}"

      - name: Configure GRUB Menu
        run: |
          cat << 'EOF' > build_dir/iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod part_gpt
          insmod ext2
          insmod all_video

          menuentry "ZUX OS Preinstallation Environment" {
              linux /boot/vmlinuz console=tty1 nomodeset quiet loglevel=3
              initrd /boot/initrd.img
          }
          EOF

      - name: Generate Installer ISO
        run: |
          grub-mkrescue -o build_dir/release_assets/ZUX-Installer.iso build_dir/iso_root

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-Build-Assets
          path: build_dir/release_assets/*

      - name: Publish Release Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.0"
          name: "ZUX OS Release 1.0"
          draft: false
          prerelease: false
          files: |
            build_dir/release_assets/ZUX.zip
            build_dir/release_assets/ZUX-Installer.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
