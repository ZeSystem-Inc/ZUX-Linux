name: ZUX OS ISO and Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cpio xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools zip wget wpasupplicant wireless-tools

      - name: Create Workspace Directories
        run: |
          mkdir -p build_dir/iso_root/boot/grub
          mkdir -p build_dir/initrd_root/installer
          mkdir -p build_dir/release_assets

      - name: Compile Setup Installer
        run: |
          gcc -O2 setup.c -o build_dir/initrd_root/installer/setup.elf

      - name: Prepare RootFS and Pack ZUX.zip
        run: |
          WORKSPACE_DIR=$(pwd)
          UPLOAD_DIR="${WORKSPACE_DIR}/build_dir/release_assets"

          if [ -d "rootfs" ] && [ "$(ls -A rootfs)" ]; then
            cd rootfs
            zip -r "${UPLOAD_DIR}/ZUX.zip" .
            cd "${WORKSPACE_DIR}"
          else
            DUMMY_DIR="${WORKSPACE_DIR}/tmp_rootfs"
            mkdir -p "${DUMMY_DIR}/etc" "${DUMMY_DIR}/bin"
            echo "ZUX OS Rootfs" > "${DUMMY_DIR}/etc/zux-release"
            cd "${DUMMY_DIR}"
            zip -r "${UPLOAD_DIR}/ZUX.zip" .
            cd "${WORKSPACE_DIR}"
            rm -rf "${DUMMY_DIR}"
          fi

      - name: Pack Initrd Payload
        run: |
          cp initrd_root/init build_dir/initrd_root/init
          chmod +x build_dir/initrd_root/init
          chmod +x build_dir/initrd_root/installer/setup.elf

          cd build_dir/initrd_root
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../iso_root/boot/initrd.img
          cd ../..

      - name: Download Linux Kernel
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/vmlinuz-6.1.0-21-amd64 -O build_dir/iso_root/boot/vmlinuz || \
          wget -q https://boot.netboot.xyz/memdisk -O build_dir/iso_root/boot/vmlinuz

      - name: Configure GRUB Menu
        run: |
          cat << 'EOF' > build_dir/iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod part_gpt
          insmod ext2
          insmod all_video
          insmod gfxterm

          set gfxmode=auto
          set gfxpayload=keep

          menuentry "ZUX OS Preinstallation Environment" {
              linux /boot/vmlinuz quiet console=tty1
              initrd /boot/initrd.img
          }
          EOF

      - name: Generate Installer ISO
        run: |
          grub-mkrescue -o build_dir/release_assets/ZUX-Installer.iso build_dir/iso_root

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-Build-Assets
          path: build_dir/release_assets/*

      - name: Publish Release 1.0 Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.0"
          name: "ZUX OS Release 1.0"
          draft: false
          prerelease: false
          files: |
            build_dir/release_assets/ZUX.zip
            build_dir/release_assets/ZUX-Installer.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
