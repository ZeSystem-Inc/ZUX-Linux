name: ZUX OS ISO Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies and Generic Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cpio xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools zip wget e2fsprogs linux-image-generic kmod zstd xz-utils

      - name: Create Workspace Directories
        run: |
          mkdir -p build_dir/iso_root/boot/grub
          mkdir -p build_dir/initrd_root/bin
          mkdir -p build_dir/initrd_root/sbin
          mkdir -p build_dir/initrd_root/usr/bin
          mkdir -p build_dir/initrd_root/usr/sbin
          mkdir -p build_dir/initrd_root/usr/share/udhcpc
          mkdir -p build_dir/initrd_root/proc
          mkdir -p build_dir/initrd_root/sys
          mkdir -p build_dir/initrd_root/dev
          mkdir -p build_dir/initrd_root/etc
          mkdir -p build_dir/initrd_root/lib/modules
          mkdir -p build_dir/initrd_root/mnt
          mkdir -p build_dir/initrd_root/tmp
          mkdir -p build_dir/initrd_root/installer
          mkdir -p build_dir/release_assets

      - name: Create BusyBox DHCP Script
        run: |
          cat << 'EOF' > build_dir/initrd_root/usr/share/udhcpc/default.script
          #!/bin/sh
          case "$1" in
              deconfig)
                  ip addr flush dev "$interface"
                  ;;
              renew|bound)
                  ip addr add "$ip/$mask" dev "$interface"
                  if [ -n "$router" ]; then
                      ip route add default via "$router" dev "$interface" 2>/dev/null || true
                  fi
                  if [ -n "$dns" ]; then
                      echo "" > /etc/resolv.conf
                      for i in $dns; do
                          echo "nameserver $i" >> /etc/resolv.conf
                      done
                  fi
                  ;;
          esac
          EOF
          chmod +x build_dir/initrd_root/usr/share/udhcpc/default.script

      - name: Download Static BusyBox Binary & Install Symlinks
        run: |
          WORKSPACE_DIR=$(pwd)
          wget -q https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox -O build_dir/initrd_root/bin/busybox
          chmod +x build_dir/initrd_root/bin/busybox

          cd build_dir/initrd_root
          ./bin/busybox --install -s .
          cd "${WORKSPACE_DIR}"

      - name: Copy Kernel Modules, Uncompress & Generate Map
        run: |
          KVER=$(ls -1 /lib/modules/ | grep generic | head -n 1)
          mkdir -p "build_dir/initrd_root/lib/modules/$KVER"
          sudo cp -r /lib/modules/$KVER/kernel "build_dir/initrd_root/lib/modules/$KVER/" 2>/dev/null || true
          sudo cp /lib/modules/$KVER/modules.* "build_dir/initrd_root/lib/modules/$KVER/" 2>/dev/null || true
          sudo chmod -R 755 "build_dir/initrd_root/lib/modules"

          echo "[*] Sürücüler açılıyor (.zst / .xz)..."
          sudo find build_dir/initrd_root/lib/modules/ -name "*.ko.zst" -exec zstd -d --rm {} + 2>/dev/null || true
          sudo find build_dir/initrd_root/lib/modules/ -name "*.ko.xz" -exec unxz {} + 2>/dev/null || true

          sudo depmod -a -b build_dir/initrd_root "$KVER"

      - name: Compile Setup Installer
        run: |
          if [ -f setup.c ]; then
            gcc -O2 -s -static -Wno-unused-result setup.c -o build_dir/initrd_root/installer/setup.elf
          fi

      - name: Compile Init Launcher from Repository
        run: |
          gcc -O2 -s -static init.c -o build_dir/initrd_root/init

      - name: Copy Universal Generic Kernel
        run: |
          KERNEL_PATH=$(ls -1 /boot/vmlinuz-*-generic | head -n 1)
          sudo cp "$KERNEL_PATH" build_dir/iso_root/boot/vmlinuz
          sudo chmod 644 build_dir/iso_root/boot/vmlinuz

      - name: Prepare RootFS Zip
        run: |
          WORKSPACE_DIR=$(pwd)
          UPLOAD_DIR="${WORKSPACE_DIR}/build_dir/release_assets"

          if [ -d "rootfs" ] && [ "$(ls -A rootfs)" ]; then
            cd rootfs && zip -r "${UPLOAD_DIR}/ZUX.zip" . && cd "${WORKSPACE_DIR}"
          else
            DUMMY_DIR="${WORKSPACE_DIR}/tmp_rootfs"
            mkdir -p "${DUMMY_DIR}/etc"
            echo "ZUX OS Rootfs" > "${DUMMY_DIR}/etc/zux-release"
            cd "${DUMMY_DIR}" && zip -r "${UPLOAD_DIR}/ZUX.zip" . && cd "${WORKSPACE_DIR}"
            rm -rf "${DUMMY_DIR}"
          fi

      - name: Pack Initrd Payload
        run: |
          WORKSPACE_DIR=$(pwd)
          cd build_dir/initrd_root
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../iso_root/boot/initrd.img
          cd "${WORKSPACE_DIR}"

      - name: Configure GRUB Menu
        run: |
          cat << 'EOF' > build_dir/iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod part_gpt
          insmod ext2
          insmod all_video

          menuentry "ZUX OS Preinstallation Environment" {
              linux /boot/vmlinuz console=tty1 nomodeset quiet loglevel=3 net.ifnames=0 biosdevname=0
              initrd /boot/initrd.img
          }
          EOF

      - name: Generate Installer ISO
        run: |
          grub-mkrescue -o build_dir/release_assets/ZUX-Installer.iso build_dir/iso_root

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-Build-Assets
          path: build_dir/release_assets/*

      - name: Publish Release Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.0"
          name: "ZUX OS Release 1.0"
          draft: false
          prerelease: false
          files: |
            build_dir/release_assets/ZUX.zip
            build_dir/release_assets/ZUX-Installer.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
