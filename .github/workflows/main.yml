name: ZUX Linux ISO & OS Package CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-zux:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Depodaki Dosyaları Çek
        uses: actions/checkout@v4

      - name: Derleme Araçlarını ve Bağımlılıkları Yükle
        run: |
          apt update
          apt install -y \
            build-essential flex bison bc libelf-dev libssl-dev \
            xorriso mtools dosfstools cpio gzip wget tar syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            busybox zip ccache gcc libc6-dev

      - name: Kernel Kaynak Kodu ve Derleme Önbelleği (Cache)
        uses: actions/cache@v4
        with:
          path: |
            src/linux
            ~/.cache/ccache
          key: ${{ runner.os }}-zux-kernel-6.6.21-v4
          restore-keys: |
            ${{ runner.os }}-zux-kernel-6.6.21-

      - name: Saf Linux Çekirdeği Kaynağını İndir
        run: |
          if [ ! -d "src/linux" ]; then
            mkdir -p src
            wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.21.tar.xz
            tar -xf linux-6.6.21.tar.xz -C src/
            mv src/linux-6.6.21 src/linux
          fi

      - name: Saf Kernel Konfigürasyonunu Yap ve Önbellekli Derle
        run: |
          cd src/linux
          if [ ! -f ".config" ]; then
            make defconfig
            scripts/config --enable CONFIG_DEVTMPFS
            scripts/config --enable CONFIG_DEVTMPFS_MOUNT
            scripts/config --enable CONFIG_BLK_DEV_SD
            scripts/config --enable CONFIG_EXT4_FS
            scripts/config --enable CONFIG_FB
            scripts/config --enable CONFIG_FB_EFI
            scripts/config --enable CONFIG_FB_VESA
            scripts/config --enable CONFIG_DRM
            scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
            scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          fi
          make -j$(nproc) CC="ccache gcc" bzImage
          cd ../..

      - name: Artifact 1 - ZUX.zip Paketini Oluştur
        run: |
          WORKSPACE_DIR=$(pwd)
          UPLOAD_DIR="${WORKSPACE_DIR}/server_upload"
          
          mkdir -p "${UPLOAD_DIR}"

          if [ -d "rootfs" ]; then
            cd rootfs
            zip -r "${UPLOAD_DIR}/ZUX.zip" .
            cd "${WORKSPACE_DIR}"
          else
            DUMMY_DIR="${WORKSPACE_DIR}/tmp_rootfs"
            mkdir -p "${DUMMY_DIR}/etc" "${DUMMY_DIR}/bin"
            echo "ZUX OS Rootfs" > "${DUMMY_DIR}/etc/zux-release"
            cd "${DUMMY_DIR}"
            zip -r "${UPLOAD_DIR}/ZUX.zip" .
            cd "${WORKSPACE_DIR}"
            rm -rf "${DUMMY_DIR}"
          fi

      - name: setup.elf Dosyasını Derle
        run: |
          mkdir -p initrd_root/installer
          gcc -static setup.c -o initrd_root/installer/setup.elf
          chmod +x initrd_root/installer/setup.elf

      - name: Artifact 2 - ZUX-netinst.iso İmajını Oluştur
        run: |
          WORKSPACE_DIR=$(pwd)
          UPLOAD_DIR="${WORKSPACE_DIR}/server_upload"
          mkdir -p iso_root/boot/grub
          cp src/linux/arch/x86/boot/bzImage iso_root/boot/vmlinuz

          cat << 'EOF' > iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=5

          insmod part_msdos
          insmod part_gpt
          insmod ext2
          insmod all_video
          insmod video_bochs
          insmod video_cirrus
          insmod gfxterm

          set gfxmode=auto
          set gfxpayload=keep
          terminal_output gfxterm

          menuentry "ZUX OS Installer" {
              linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 quiet
              initrd /boot/initrd.img
          }

          menuentry "ZUX OS Installer (Safe Graphics Mode)" {
              linux /boot/vmlinuz console=tty0 nomodeset vga=normal
              initrd /boot/initrd.img
          }
          EOF

          mkdir -p initrd_root/bin
          cp /bin/busybox initrd_root/bin/busybox
          chmod +x initrd_root/bin/busybox
          initrd_root/bin/busybox --install -s initrd_root/bin

          chmod +x initrd_root/init || true

          cd initrd_root
          find . | cpio -o -H newc | gzip -9 > ../iso_root/boot/initrd.img
          cd "${WORKSPACE_DIR}"

          grub-mkrescue -o "${UPLOAD_DIR}/ZUX-netinst.iso" iso_root/ -- -volid "ZUX_NETINST"
          isohybrid --uefi "${UPLOAD_DIR}/ZUX-netinst.iso" || true

      - name: Artifact 1'i Yükle (ZUX.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-Main-OS-Zip
          path: server_upload/ZUX.zip
          retention-days: 7

      - name: Artifact 2'yi Yükle (ZUX-Netinst-ISO)
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-Netinst-ISO
          path: server_upload/ZUX-netinst.iso
          retention-days: 7
