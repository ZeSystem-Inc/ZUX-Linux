name: Build ZUX OS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cpio xorriso grub-pc-bin grub-common libarchive-tools

      - name: setup.elf Dosyasını Statik Derle (WinPE Style)
        run: |
          mkdir -p initrd_root/installer
          gcc -static -O2 setup.c -o initrd_root/installer/setup.elf
          chmod +x initrd_root/installer/setup.elf

      - name: init Çalıştırılabilir İzinlerini Ayarla
        run: |
          chmod +x initrd_root/init

      - name: initrd.img Oluştur
        run: |
          cd initrd_root
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../initrd.img
          cd ..

      - name: ISO Dizin Yapısını Hazırla
        run: |
          mkdir -p iso_root/boot/grub
          cp initrd.img iso_root/boot/
          # Varsa özel kernel imajını kopyala, yoksa varsayılanı kullan
          if [ -f kernel/vmlinuz ]; then
            cp kernel/vmlinuz iso_root/boot/vmlinuz
          else
            cp /boot/vmlinuz-$(uname -r) iso_root/boot/vmlinuz
          fi

      - name: GRUB Konfigürasyonunu Oluştur
        run: |
          cat << 'EOF' > iso_root/boot/grub/grub.cfg
          set timeout=5
          set default=0

          menuentry "ZUX OS Kurulum Ortami (WinPE Style)" {
              linux /boot/vmlinuz quiet console=tty1
              initrd /boot/initrd.img
          }
          EOF

      - name: ZUX-netinst.iso İmajını Derle
        run: |
          grub-mkrescue -o ZUX-netinst.iso iso_root

      - name: ISO'yu Artifact Varliği Yap
        uses: actions/upload-artifact@v4
        with:
          name: ZUX-netinst-iso
          path: ZUX-netinst.iso
